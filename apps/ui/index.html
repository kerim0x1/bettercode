<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — backstop against renderer XSS. The backend
      auth token stays in Electron's main process, which injects the bearer
      at the network layer only for trusted app renderer requests. Runtime
      JavaScript receives the backend port but never the token.

      Two policies apply; a resource must satisfy both. This first one is
      the ceiling shared by every way the bundle is served. The bootstrap
      script below (public/csp-bootstrap.js, a classic script from the
      bundle's own origin) adds a second, narrower policy before the
      application module runs:
        - always: `connect-src` limited to loopback, the page's own origin
          and the configured remote backend;
        - in the desktop app (the preload bridge exists): `script-src 'self'
          'wasm-unsafe-eval'`, so no inline script, inline event handler or
          injected <script> runs after this point, and `frame-src 'self'
          blob:`, so the privileged window cannot frame remote pages.
      No policy allows inline script. When the backend serves this bundle
      to a browser (remote access) it injects its runtime-config script with
      a per-response nonce and adds that `'nonce-…'` to this ceiling's
      `script-src` (apps/backend/src/remote/web.ts). No
      policy allows `'unsafe-eval'`: nothing in the bundle evaluates
      strings; Shiki's WebAssembly needs only `'wasm-unsafe-eval'`. Vite's
      dev-only inline preamble is injected before this element, so it is
      not affected. Preview pages are shown in <webview> guests, which run
      in their own process and session and are not governed by
      `frame-src`; the main process gates them (`will-attach-webview`,
      `isAllowedWebviewUrl`). `blob:` frames are the renderer's own local
      file previews (PDF).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:* https: wss:; frame-src 'self' blob: https: http:; media-src 'self' https: blob:; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <script src="/csp-bootstrap.js"></script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%favicon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterC0de</title>
    <!-- No hand-rolled <link rel="preload" href="/src/main.tsx"> here.
         Vite's HTML transformer bundled that as a base64
         `data:application/octet-stream` script URI in the production
         build, which the renderer's `script-src` CSP then refused to load — surfaced in DevTools
         every time a chat message was sent. Vite emits the right
         `<link rel="modulepreload">` for each output chunk
         automatically, so a manual preload is both redundant and
         harmful. -->
    <style>
      /* Prevent FOUC — match the app's dark background immediately */
      html, body, #root { margin: 0; padding: 0; background: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
