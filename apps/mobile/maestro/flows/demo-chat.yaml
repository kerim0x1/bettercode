# The demo, as App Review sees it: start it from the pairing screen, open a
# chat, send a message, approve the agent's request, read the reply, and
# leave the demo from the Host tab.
#
# Every target is scrolled to before it is used: on a small phone (and the
# CI emulator's 320x640 screen) "Try the demo", the approval and Exit demo
# start below the fold.
appId: com.betterc0de.remote
name: The demo from the pairing screen to Exit demo
tags:
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: pair-demo
    direction: DOWN
- tapOn:
    id: pair-demo
- extendedWaitUntil:
    visible:
      id: chats-screen
    timeout: 20000
- assertVisible:
    id: connection-demo
- scrollUntilVisible:
    element:
      id: thread-row-demo-release-notes
    direction: DOWN
- tapOn:
    id: thread-row-demo-release-notes
- tapOn:
    id: chat-input
- inputText: Draft the release notes
- hideKeyboard
- tapOn:
    id: chat-send
- scrollUntilVisible:
    element:
      id: request-approve
    direction: DOWN
    timeout: 30000
- assertVisible: Run npm test
- tapOn:
    id: request-approve
- scrollUntilVisible:
    element: .*24 passed.*
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: request-approve
- tapOn: Back
- tapOn: Host
- scrollUntilVisible:
    element:
      id: exit-demo
    direction: DOWN
- tapOn:
    id: exit-demo
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 20000
