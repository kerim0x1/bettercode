# Source control in the demo: open it from a project, stage a file and one
# of the README's two changes, commit with a generated message, and push.
#
# Every target is scrolled to before it is used: on a small phone (and the
# CI emulator's 320x640 screen) most of the review starts below the fold.
appId: com.betterc0de.remote
name: Source control stages, commits and pushes in the demo
tags:
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: pair-demo
    direction: DOWN
- tapOn:
    id: pair-demo
- extendedWaitUntil:
    visible:
      id: chats-screen
    timeout: 20000
# By id: iOS reads the tab as "Projects, tab, 2 of 3".
- tapOn:
    id: tab-projects
- tapOn:
    id: project-weather-app
- scrollUntilVisible:
    element:
      id: source-control-weather-app
    direction: DOWN
- tapOn:
    id: source-control-weather-app
- extendedWaitUntil:
    visible:
      id: git-screen
    timeout: 20000

- scrollUntilVisible:
    element:
      id: git-stage-src/theme\.ts
    direction: DOWN
- tapOn:
    id: git-stage-src/theme\.ts
- scrollUntilVisible:
    element:
      id: git-unstage-src/theme\.ts
    direction: UP

# One change of two: the other stays unstaged.
- scrollUntilVisible:
    element:
      id: git-file-README\.md
    direction: DOWN
- tapOn:
    id: git-file-README\.md
- extendedWaitUntil:
    visible:
      id: git-hunk-stage-0
    timeout: 20000
- assertVisible:
    id: diff-hunk-1
- tapOn:
    id: git-hunk-stage-0
- extendedWaitUntil:
    notVisible:
      id: diff-hunk-1
    timeout: 20000
- tapOn: Back

- scrollUntilVisible:
    element:
      id: git-generate
    direction: UP
- tapOn:
    id: git-generate
# Commit turns on once the generated message is in the box.
- extendedWaitUntil:
    visible:
      id: git-commit
      enabled: true
    timeout: 20000
- scrollUntilVisible:
    element:
      id: git-commit
    direction: DOWN
- tapOn:
    id: git-commit
# The branch row names how far it is ahead (iOS reads only the row). On a
# small screen it is above the fold by now: scrolled to while it updates.
- scrollUntilVisible:
    element:
      text: ".*2 to push.*"
    direction: UP
    timeout: 20000

# The desktop's question first; Android may show its button in capitals.
- tapOn:
    id: git-push
- tapOn: "(?i)push"
- extendedWaitUntil:
    notVisible: ".*2 to push.*"
    timeout: 20000
