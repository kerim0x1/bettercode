# betterc0de://demo opens the demo. This checks the scheme the native
# project registers, which only a real build has.
appId: com.betterc0de.remote
name: The demo link opens the demo
tags:
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 60000
- openLink: betterc0de://demo?speed=instant
# iOS asks before a link opens an app ("Open in “BetterC0de Remote”?"); the
# question stays on screen otherwise, over every flow after this one.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Open
          optional: true
      # The question is iOS's, not the app's, and Maestro does not always
      # see it (iOS 26). Once the app has had time to take the link (a busy
      # CI simulator took more than 5 s), and only while its chat list has
      # not appeared at all, Open is tapped where it sits: right of the
      # middle, below the question. A tap while the pairing screen fades out
      # left the transition half done.
      - extendedWaitUntil:
          visible:
            id: chats-screen
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: pair-screen
            notVisible:
              id: chats-screen
          commands:
            - tapOn:
                point: "68%,54%"
            # The link can still arrive just then, and the tap open a chat
            # of the list instead: back to the list.
            - extendedWaitUntil:
                visible:
                  id: chat-input
                timeout: 3000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: chat-input
                commands:
                  - tapOn: Back
- extendedWaitUntil:
    visible:
      id: chats-screen
    timeout: 20000
- assertVisible:
    id: connection-demo
- assertVisible:
    id: thread-row-demo-dark-mode
