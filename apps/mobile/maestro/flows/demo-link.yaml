# betterc0de://demo opens the demo. This checks the scheme the native
# project registers, which only a real build has.
appId: com.betterc0de.remote
name: The demo link opens the demo
tags:
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 60000
- openLink: betterc0de://demo?speed=instant
# iOS asks before a link opens an app ("Open in “BetterC0de Remote”?"), and
# a question left open covers every flow after this one. Maestro sees it
# while it shows. On a busy CI simulator it did not show until the app was
# started again (by the next flow), 50 s later. So on iOS:
# - Open is tapped whenever the question shows, for up to 30 s;
# - if neither the question nor the chat list came, the app is started
#   again, its state kept, which brings the question up, and Open is tapped.
# Open's point is tapped only while the question still shows after a tap on
# its text, never blind.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 6
          while:
            notVisible:
              id: chats-screen
          commands:
            - runFlow:
                when:
                  visible: "Open in .*"
                commands:
                  - tapOn: Open
            - runFlow:
                when:
                  visible: "Open in .*"
                commands:
                  - tapOn:
                      point: "68%,54%"
            - extendedWaitUntil:
                visible:
                  id: chats-screen
                timeout: 5000
                optional: true
      - runFlow:
          when:
            notVisible:
              id: chats-screen
          commands:
            - launchApp
            - extendedWaitUntil:
                visible: "Open in .*"
                timeout: 30000
                optional: true
            - runFlow:
                when:
                  visible: "Open in .*"
                commands:
                  - tapOn: Open
            - runFlow:
                when:
                  visible: "Open in .*"
                commands:
                  - tapOn:
                      point: "68%,54%"
- extendedWaitUntil:
    visible:
      id: chats-screen
    timeout: 30000
- assertVisible:
    id: connection-demo
- assertVisible:
    id: thread-row-demo-dark-mode
