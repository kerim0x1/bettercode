# betterc0de://demo opens the demo. This checks the scheme the native
# project registers, which only a real build has.
appId: com.betterc0de.remote
name: The demo link opens the demo
tags:
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 60000
- openLink: betterc0de://demo?speed=instant
# iOS asks before a link opens an app; the answer stays on screen otherwise,
# over every flow after this one.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible:
      id: chats-screen
    timeout: 20000
- assertVisible:
    id: connection-demo
- assertVisible:
    id: thread-row-demo-dark-mode
