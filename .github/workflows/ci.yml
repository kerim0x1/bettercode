name: CI

# Every push and pull request runs the same `npm run release:check` a release
# has to pass: clean install, versions, formatting, lint, type-check, tests,
# production build, packaging, a launch of the packaged app, installers, and
# an install → launch → uninstall test of those installers on a clean runner.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Automated builds must not send heartbeat or diagnostic reports.
env:
  BETTERC0DE_DISABLE_PING: "1"
  BETTERC0DE_DISABLE_CRASH_REPORTS: "1"

permissions:
  contents: read

jobs:
  release-check:
    name: release:check (${{ matrix.name }})
    # Branches in this repository are covered by their push run; the
    # pull_request event is what runs for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, arch: x64, timeout: 75 }
          - { name: Windows x64, os: windows-2025, arch: x64, timeout: 75 }
          - { name: macOS arm64, os: macos-15, arch: arm64, timeout: 75 }
          - { name: macOS x64, os: macos-15-intel, arch: x64, timeout: 120 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check compares against main or the previous push.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: release:check
        run: npm run release:check -- --arch ${{ matrix.arch }}

  node-compat:
    name: Node ${{ matrix.node }} source and build (${{ matrix.os }})
    # engines allows the next LTS line too. The packaged app runs on
    # Electron's own Node, so this leg stops before packaging.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["24.21.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}

      - name: release:check up to the production build
        run: npm run release:check -- --until build
