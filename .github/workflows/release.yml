# Release pipeline.
#
# Push a `v<version>` tag that matches package.json (the pre-push hook runs
# `npm run release:check` locally first). This workflow then:
#   1. runs the full release:check on every supported platform; each job
#      builds, launches, installs and uninstalls its installers and keeps them
#      as artifacts
#   2. runs the Node compatibility leg
#   3. only when every job passed: assembles one release from the artifacts
#      (merged macOS update metadata, sha512 cross-check of every update
#      entry, one SHA256SUMS.txt), uploads it to a draft, confirms every file
#      arrived, and publishes the draft
# Nothing reaches the release page unless all platforms passed. Manual runs
# (workflow_dispatch) stop after step 2 and keep the installers as workflow
# artifacts.
#
# Releases are unsigned by decision (docs/development/code-signing.md), so the
# workflow uses no secrets beyond the automatic GITHUB_TOKEN.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Automated builds must not send heartbeat or diagnostic reports.
env:
  BETTERC0DE_DISABLE_PING: "1"
  BETTERC0DE_DISABLE_CRASH_REPORTS: "1"

permissions:
  contents: read

jobs:
  tag:
    name: Tag, version and release notes agree
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag matches the package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $expected"
            exit 1
          fi

      - name: CHANGELOG.md has an entry for this version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG"

  release-check:
    name: release:check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, arch: x64, timeout: 75, artifact: installers-linux-x64 }
          - { name: Windows x64, os: windows-2025, arch: x64, timeout: 75, artifact: installers-windows-x64 }
          - { name: macOS arm64, os: macos-15, arch: arm64, timeout: 75, artifact: installers-macos-arm64 }
          - { name: macOS x64, os: macos-15-intel, arch: x64, timeout: 120, artifact: installers-macos-x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check needs origin/main to find its base revision.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare

      # The DMG is laid out on a mounted disk image, which is then ejected.
      # While Spotlight indexes the freshly mounted volume, the eject fails
      # ("hdiutil: couldn't eject disk4 - Resource busy") and with it the
      # build. A CI machine needs no search index.
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - name: release:check
        # The phone app is built by its own jobs.
        run: npm run release:check -- --arch ${{ matrix.arch }} --mobile none

      - name: Keep the verified installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  node-compat:
    name: Node ${{ matrix.node }} source and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["24.21.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check needs origin/main to find its base revision.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}

      - name: release:check up to the production build
        run: npm run release:check -- --until build

  publish:
    name: Publish the release
    needs: [tag, release-check, node-compat]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the release tooling
        # Only JavaScript dependencies are needed here (yaml).
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the installers from every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: artifacts

      - name: Assemble and verify the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run release:assemble -- artifacts dist-release
          node scripts/release-notes.mjs "$TAG" release-notes.md

      - name: Upload to a draft, confirm every file arrived, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi

          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Published releases are never modified; release a new version instead."
              exit 1
            fi
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --draft --verify-tag \
              --title "BetterC0de $TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi

          expected="$(ls dist-release | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The draft's assets differ from the verified set:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "$TAG" --draft=false "${prerelease[@]}"
