# Universal release pipeline.
#
# Trigger by pushing a `v*.*.*` tag (e.g. `git tag v0.1.0 && git push --tags`)
# or running this workflow manually from the Actions tab. Tag runs publish;
# manual runs build and upload workflow artifacts without creating a GitHub
# Release. Each platform is built on its native runner so `electron-rebuild`
# produces the correct native binaries for that OS / Electron ABI.
#
# Required secrets (only set what you have — missing secrets cause graceful
# skips, not build failures):
#   GH_TOKEN                          GitHub PAT with Contents: write (or use
#                                     the auto-provided GITHUB_TOKEN — already
#                                     wired below)
#   APPLE_ID                          Apple Developer email (for notarization)
#   APPLE_APP_SPECIFIC_PASSWORD       App-specific password from appleid.apple.com
#   APPLE_TEAM_ID                     10-char Apple Team ID
#   CSC_LINK                          Base64 .p12 (or HTTPS URL) — macOS code-signing cert
#   CSC_KEY_PASSWORD                  Password for the .p12
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   (Optional) Windows code-signing cert
#                                     — currently unsigned by user choice.

name: Release

# Automated builds must not send heartbeat or diagnostic reports.
env:
  BETTERC0DE_DISABLE_PING: "1"
  BETTERC0DE_DISABLE_CRASH_REPORTS: "1"

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify source and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          BETTERC0DE_SKIP_POSTINSTALL: "1"
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const expected = 'v' + version;
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected);
            process.exit(1);
          }"

      - name: Shared source verification gate
        uses: ./.github/actions/verify-source

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform_flag: --mac
            arch: x64
            artifact_name: installers-macos-x64
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/SHA256SUMS-*.txt
          - os: macos-15
            platform_flag: --mac
            arch: arm64
            artifact_name: installers-macos-arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/SHA256SUMS-*.txt
          - os: windows-latest
            platform_flag: --win
            arch: x64
            artifact_name: installers-windows-x64
            artifact_paths: |
              release/*.exe
              release/SHA256SUMS-*.txt
          - os: ubuntu-latest
            platform_flag: --linux
            arch: x64
            artifact_name: installers-linux-x64
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/SHA256SUMS-*.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # Keep native modules on the runner's Node ABI for the backend
          # startup smoke. The package action rebuilds for Electron afterward.
          BETTERC0DE_SKIP_POSTINSTALL: "1"
        run: npm ci --no-audit --no-fund

      - name: Shared package, packaged startup, and publish gate
        uses: ./.github/actions/package-platform
        with:
          platform-flag: ${{ matrix.platform_flag }}
          arch: ${{ matrix.arch }}
          build-installers: "true"
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization (no-op when secrets missing)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Windows code-signing (no-op when unset; current default)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installers as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish completed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Make the verified installer draft public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          PRERELEASE=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE=true; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$PRERELEASE" --title "BetterC0de $GITHUB_REF_NAME"
