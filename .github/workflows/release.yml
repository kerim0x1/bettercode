# Release pipeline.
#
# Push a `v<version>` tag that matches package.json (the pre-push hook runs
# `npm run release:check` locally first). This workflow then:
#   1. runs the full release:check on every supported platform; each job
#      builds, launches, installs and uninstalls its installers and keeps them
#      as artifacts
#   2. runs the Node compatibility leg
#   3. builds the phone app: the APK signed with the release key, device
#      tests on that exact APK, and the iOS app on a simulator
#   4. only when every job passed: assembles one release from the artifacts
#      (merged macOS update metadata, sha512 cross-check of every update
#      entry, the APK's certificate against the pinned one, one
#      SHA256SUMS.txt), uploads it to a draft, confirms every file arrived,
#      and publishes the draft
#   5. starts the iOS build for TestFlight on EAS, which submits it itself
# Nothing reaches the release page unless all platforms passed. Manual runs
# (workflow_dispatch) stop after step 2 and keep the installers as workflow
# artifacts.
#
# The phone app joins releases once its keys and accounts are set up and
# the repository variable BETTERC0DE_MOBILE_RELEASE is "true"
# (docs/release-checklist.md); until then steps 3 and 5 are skipped.
#
# The desktop app is unsigned by decision (docs/development/code-signing.md).
# The phone app has to be signed: Android and iOS install nothing else. Its
# secrets live only in the `release` environment, which admits `v*` tags,
# and only the jobs that sign or submit use it.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Automated builds must not send heartbeat or diagnostic reports.
env:
  BETTERC0DE_DISABLE_PING: "1"
  BETTERC0DE_DISABLE_CRASH_REPORTS: "1"

permissions:
  contents: read

jobs:
  tag:
    name: Tag, version and release notes agree
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag matches the package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $expected"
            exit 1
          fi

      - name: CHANGELOG.md has an entry for this version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG"

  release-check:
    name: release:check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, arch: x64, timeout: 75, artifact: installers-linux-x64 }
          - { name: Windows x64, os: windows-2025, arch: x64, timeout: 75, artifact: installers-windows-x64 }
          - { name: macOS arm64, os: macos-15, arch: arm64, timeout: 75, artifact: installers-macos-arm64 }
          - { name: macOS x64, os: macos-15-intel, arch: x64, timeout: 120, artifact: installers-macos-x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check needs origin/main to find its base revision.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: release:check
        # The phone app is built by its own jobs.
        run: npm run release:check -- --arch ${{ matrix.arch }} --mobile none

      - name: Keep the verified installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  node-compat:
    name: Node ${{ matrix.node }} source and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["24.21.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check needs origin/main to find its base revision.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}

      - name: release:check up to the production build
        run: npm run release:check -- --until build

  mobile-android:
    name: Phone app for Android (release key)
    if: vars.BETTERC0DE_MOBILE_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release
    env:
      BETTERC0DE_SKIP_POSTINSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          desktop: "false"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare Android
        uses: ./.github/actions/prepare-android

      - name: Build and check the APK with the release key
        env:
          BETTERC0DE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BETTERC0DE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BETTERC0DE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BETTERC0DE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/mobile-android.mjs build --signing release

      - name: Device tests on this APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: BetterC0de_Test
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node scripts/mobile-android.mjs e2e

      - name: Keep the verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-android
          path: apps/mobile/build/android/BetterC0de-Remote-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Keep the device-test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-e2e
          path: apps/mobile/build/e2e/android
          if-no-files-found: ignore

  mobile-ios:
    name: Phone app on iOS (simulator)
    if: vars.BETTERC0DE_MOBILE_RELEASE == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BETTERC0DE_SKIP_POSTINSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          desktop: "false"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set up JDK 17 for Maestro
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Build, check and device-test the app
        run: node scripts/mobile-ios.mjs all

  publish:
    name: Publish the release
    needs: [tag, release-check, node-compat, mobile-android, mobile-ios]
    # The phone app's jobs are skipped until it joins releases; a skipped
    # job does not hold the desktop release back, a failed one does.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the release tooling
        # Only JavaScript dependencies are needed here (yaml).
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the installers from every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: artifacts

      - name: Assemble and verify the release
        env:
          TAG: ${{ github.ref_name }}
          # With the phone app in the release, its APK is required.
          ANDROID: ${{ vars.BETTERC0DE_MOBILE_RELEASE == 'true' && '--android' || '' }}
        run: |
          npm run release:assemble -- artifacts dist-release $ANDROID
          node scripts/release-notes.mjs "$TAG" release-notes.md

      - name: Upload to a draft, confirm every file arrived, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi

          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Published releases are never modified; release a new version instead."
              exit 1
            fi
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --draft --verify-tag \
              --title "BetterC0de $TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi

          expected="$(ls dist-release | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The draft's assets differ from the verified set:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "$TAG" --draft=false "${prerelease[@]}"

  testflight:
    name: iOS build for TestFlight (EAS)
    needs: publish
    if: vars.BETTERC0DE_MOBILE_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    env:
      BETTERC0DE_SKIP_POSTINSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          desktop: "false"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Start the TestFlight build
        # EAS builds and submits on its own schedule; the free plan's queue
        # can take hours, so this job does not wait for it.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node scripts/eas-ios-release.mjs "$TAG"
