version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron supports only its three newest majors, and the browser
      # preview loads arbitrary web pages in its Chromium. Keep the runtime,
      # the packager and the updater in one PR, majors included, so a new
      # major is proposed together with the builder that supports it. Listed
      # first: a dependency joins the first group it matches.
      electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
          - "@electron/*"
      runtime-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # The Expo SDK fixes React Native and its native modules as one set
      # (`expo install --check` in mobile:check enforces it). Moving to a new
      # SDK is done deliberately, all packages at once. React Native is still
      # 0.x, so its "minor" releases are the breaking ones.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    # "/" covers .github/workflows only; the composite actions under
    # .github/actions/* pin their own third-party actions by SHA.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
