name: BetterC0de platform package
description: Shared build, unpacked-package smoke, and optional publishing gate.
inputs:
  platform-flag:
    description: electron-builder platform flag.
    required: true
  arch:
    description: Target architecture (x64 or arm64).
    required: true
  publish:
    description: Whether to publish installers after the unpacked artifact passes smoke.
    required: false
    default: "never"
  build-installers:
    description: Whether to build installers from the verified unpacked artifact.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Build application
      shell: bash
      env:
        # Vite's production bundle can exceed Node's default ~2 GiB heap on
        # hosted macOS runners while rendering the Monaco worker chunks.
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        npm run build
        npm run smoke:backend
    - name: Rebuild native modules for Electron
      shell: bash
      run: npm run backend:rebuild -- --arch ${{ inputs.arch }}
    - name: Package unpacked application
      shell: bash
      run: |
        npm run clean:release
        # GitHub Actions exposes missing secrets as empty environment
        # variables. electron-builder treats an empty CSC_LINK as the
        # project directory, then fails with "... not a file" on macOS.
        # Keep real credentials, but remove empty optional signing values.
        for name in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
          if [ -z "${!name:-}" ]; then unset "$name"; fi
        done
        SIGNING_METADATA=$(node -p "require('./scripts/pack-electron.cjs').buildSigningMetadataArgs()[0]")
        npx electron-builder ${{ inputs.platform-flag }} --${{ inputs.arch }} --dir --publish never "$SIGNING_METADATA"
    - name: Enforce packaged size budgets
      shell: bash
      run: npm run audit:package-size
    - name: Smoke-test packaged application startup
      id: packaged-smoke
      shell: bash
      run: npm run smoke:package
    - name: Build installers
      if: inputs.build-installers == 'true'
      shell: bash
      env:
        PREPACKAGED_PATH: ${{ steps.packaged-smoke.outputs.prepackaged-path }}
      run: |
        test -n "$PREPACKAGED_PATH"
        for name in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
          if [ -z "${!name:-}" ]; then unset "$name"; fi
        done
        npx electron-builder ${{ inputs.platform-flag }} --${{ inputs.arch }} --prepackaged "$PREPACKAGED_PATH" --publish ${{ inputs.publish }}
    - name: Generate installer checksums
      if: inputs.build-installers == 'true'
      shell: bash
      env:
        CHECKSUM_FILE: SHA256SUMS-${{ runner.os }}-${{ inputs.arch }}.txt
      run: npm run release:checksums
    - name: Attach checksums to the tagged GitHub release
      if: inputs.build-installers == 'true' && inputs.publish == 'always'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" "release/SHA256SUMS-${RUNNER_OS}-${{ inputs.arch }}.txt" --clobber
