name: Prepare an Android build of the phone app
description: >-
  JDK 17, the Android SDK packages the app's React Native version names
  (read from node_modules, so this runs after npm ci), KVM for the emulator,
  and caches for Gradle and the pinned Maestro.
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - name: List the SDK packages React Native needs
      id: sdk
      shell: bash
      run: node scripts/mobile-toolchain.mjs --sdk-packages >> "$GITHUB_OUTPUT"

    - name: Set up the Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: ${{ steps.sdk.outputs.packages }}
        log-accepted-android-sdk-licenses: "false"

    - name: Cache Gradle
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Cache Maestro
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/betterc0de/maestro
        key: maestro-${{ runner.os }}-${{ hashFiles('apps/mobile/maestro/maestro.json') }}

    - name: Let the emulator use KVM
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
